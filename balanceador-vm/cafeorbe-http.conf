# CaféOrbe · NGINX de cada máquina virtual detrás del Azure Load Balancer (puerto 80).
# Sirve la sonda de salud del balanceador, el reto HTTP-01 de Let's Encrypt y redirige el resto a HTTPS.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# SEG-04: se registra la ruta ($uri), nunca la cadena de consulta donde viaja el ticket del WebSocket.
log_format cafeorbe escape=json
  '{"time":"$time_iso8601","logger_name":"cafeorbe.balanceador","vm":"$hostname","metodo":"$request_method",'
  '"ruta":"$uri","estado":$status,"upstream_estado":"$upstream_status","duracion_s":$request_time,'
  '"ip":"$remote_addr","correlationId":"$http_x_correlation_id"}';

server {
  listen 80 default_server;
  server_tokens off;
  access_log /var/log/nginx/cafeorbe.log cafeorbe;

  # Sonda HTTP del Azure Load Balancer.
  location = /lb/salud {
    access_log off;
    default_type text/plain;
    return 200 "UP $hostname\n";
  }

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / { return 301 https://$host$request_uri; }
}
