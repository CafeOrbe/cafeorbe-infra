name: DIS-01 · disponibilidad en Azure

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente que se configurará y verificará
        required: true
        default: qa
        type: choice
        options: [qa, prod]
      ejecutar_caos:
        description: Terminar una réplica de auction y medir la continuidad
        required: true
        default: false
        type: boolean

jobs:
  disponibilidad:
    environment: ${{ inputs.ambiente == 'prod' && 'PROD' || 'QA' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ingresar a Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar réplicas y sondas
        run: ./scripts/dis-01-configurar.sh '${{ inputs.ambiente }}'

      - name: Verificar topología y salud
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: set -o pipefail; ./scripts/dis-01-verificar.sh '${{ inputs.ambiente }}' | tee evidencia-dis-01.txt

      - name: Prueba de caos
        if: inputs.ejecutar_caos
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: set -o pipefail; ./scripts/dis-01-caos.sh '${{ inputs.ambiente }}' | tee evidencia-caos-dis-01.txt

      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-dis-01-${{ inputs.ambiente }}-${{ github.run_number }}
          path: evidencia-*.txt
          if-no-files-found: error
          retention-days: 30
